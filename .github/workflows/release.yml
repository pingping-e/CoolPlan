# Builds + uploads to CurseForge when you push a version tag.
#   git tag v0.1.1 && git push origin v0.1.1
#
# Requires (on the CoolPlan repo):
#   - Settings > Secrets > Actions: CF_API_KEY        (CurseForge API token)
#   - Settings > Secrets > Actions: WAGO_API_TOKEN    (Wago author/publish token)
#   - CoolPlan.toc:  ## X-Curse-Project-ID: 1563905   (already set)
#   - CoolPlan.toc:  ## X-Wago-ID: qGZOnaNd           (already set)
# The BigWigsMods packager reads .pkgmeta (package-as: CoolPlan) and uploads to
# CurseForge + Wago when both the IDs and matching secrets are present.
name: Package and release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
