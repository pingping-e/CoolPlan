# Builds + (optionally) uploads to CurseForge when you push a version tag.
#   git tag v0.1.0 && git push origin v0.1.0
#
# To enable the CurseForge upload, on the CoolPlan repo set:
#   - Settings > Secrets > Actions: CF_API_KEY  (from your CurseForge account)
#   - CoolPlan.toc:  ## X-Curse-Project-ID: <your project id>
# Without those, the packager still builds the zip artifact; it just skips upload.
name: Package and release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
